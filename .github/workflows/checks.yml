name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check --diff

      - name: Type check
        run: uv run ty check --output-format github

      - name: Tests
        run: uv run pytest
